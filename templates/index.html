<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Notes Dashboard & Social Sharer</title>
    <meta name="description" content="A premium, real-time dashboard tracking Google Cloud BigQuery release updates with built-in social media sharing capabilities.">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </div>
            <h1>BigQuery Release Notes</h1>
        </div>
        
        <div style="display: flex; gap: 0.75rem; align-items: center;">
            <!-- Theme Toggle -->
            <button id="theme-toggle" class="btn btn-secondary" aria-label="Toggle light and dark theme">
                <svg class="theme-icon-light" style="width: 16px; height: 16px; fill: currentColor; display: block;" viewBox="0 0 24 24">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.02-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.38-.38.38-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z"/>
                </svg>
                <svg class="theme-icon-dark" style="width: 16px; height: 16px; fill: currentColor; display: none;" viewBox="0 0 24 24">
                    <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10C2.2 6.7 6.5 2.2 12 2c.3 0 .6.2.7.5.1.3 0 .7-.3.9-1.9 1.7-3 4.1-3 6.6 0 4.7 3.8 8.5 8.5 8.5 2.5 0 4.9-1.1 6.6-3 .2-.3.5-.4.9-.3.3.1.5.4.5.7-1.1 5.5-5.6 9.8-11.6 10.1z"/>
                </svg>
                <span id="theme-toggle-text">Light Mode</span>
            </button>
            
            <!-- Export CSV -->
            <button id="btn-export-csv" class="btn btn-secondary" aria-label="Export release notes to CSV">
                <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                </svg>
                <span>Export CSV</span>
            </button>
            
            <!-- Refresh Feed -->
            <button id="btn-refresh" class="btn btn-refresh" aria-label="Refresh release notes">
                <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                <div class="spinner" aria-hidden="true"></div>
                <span>Refresh Feed</span>
            </button>
        </div>
    </header>

    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner" style="display: none;"></div>

    <!-- Main Workspace Container -->
    <main class="app-container">
        
        <!-- Sidebar: List of updates -->
        <section class="sidebar" aria-label="Updates List">
            <div class="sidebar-header">
                <!-- Search bar -->
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search release notes..." aria-label="Search release notes">
                    <button id="search-clear" class="search-clear" aria-label="Clear search" style="display: none;">&times;</button>
                </div>
                <!-- Categories filter tags -->
                <div class="filter-tags" role="group" aria-label="Filter release notes by category">
                    <button class="filter-btn active" id="filter-btn-all" data-category="all">All</button>
                    <button class="filter-btn" id="filter-btn-feature" data-category="feature">Features</button>
                    <button class="filter-btn" id="filter-btn-fix" data-category="fix">Fixes</button>
                    <button class="filter-btn" id="filter-btn-change" data-category="change">Changes</button>
                    <button class="filter-btn" id="filter-btn-deprecation" data-category="deprecation">Deprecations</button>
                </div>
            </div>
            
            <!-- List scroll area -->
            <div class="notes-list" id="notes-list" role="list">
                <!-- Javascript will render item cards here -->
            </div>
        </section>
        
        <!-- Content panel: Release Note Details -->
        <section class="details-panel" id="details-panel" aria-label="Release note details">
            <!-- Empty state (default) -->
            <div class="empty-state">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <h3>No Update Selected</h3>
                <p>Select a release note from the list on the left to read details.</p>
            </div>
        </section>
        
    </main>

    <!-- Social Tweet Modal Overlay -->
    <div class="modal-overlay" id="tweet-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Compose Tweet</h3>
                <button class="modal-close" aria-label="Close dialog">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <label for="tweet-textarea" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Review your Tweet before sharing on X:</label>
                <textarea id="tweet-textarea" class="tweet-textarea" placeholder="What's happening in BigQuery?"></textarea>
                <div class="tweet-counter-wrapper">
                    <span style="font-style: italic;">* URL and space will be appended automatically.</span>
                    <span class="tweet-counter" id="tweet-counter">0 / 280 characters</span>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="btn-cancel-tweet">Cancel</button>
                    <button class="btn btn-primary btn-tweet" id="btn-submit-tweet">
                        <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        Post to X
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Script -->
    <script src="/static/js/app.js"></script>
</body>
</html>
